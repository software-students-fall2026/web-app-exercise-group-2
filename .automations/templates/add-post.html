<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lost and Found</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <div class="add-post">
            <header class="add-post-header">
                <a href="home.html" class="back-button">&larr; Back</a>
                <h1 class="white">Add a post</h1>
            </header>

            <form class="post-info" action="home.html" method="GET">
                <label for="post-title">Post title:</label>
                <input type="text" id="post-title" name="title" placeholder="Title">

                <label for="item-desc">Item description:</label>
                <input type="text" id="item-desc" name="description" placeholder="Description">

                <label for="last-seen">Last seen:</label>
                <input type="text" id="last-seen" name="last_seen" placeholder="Location/Date">

                <button type="submit" class="submit-button">Post</button>
            </form>
        </div>
    </body>
</html>
