<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lost and Found</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <h1 class="white">Add a post</h1>

        <form class="post-info">
            <label for="post-title">Post title:</label>
            <input type="text" id="post-title" placeholder="Title">

            <label for="item-desc">Item description:</label>
            <input type="text" id="item-desc" placeholder="Description">

            <label for="last-seen">Last seen:</label>
            <input type="text" id="last-seen" placeholder="Location/Date">

            <button type="submit">Post</button>
        </form>
    </body>
</html>
