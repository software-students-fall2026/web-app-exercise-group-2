<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Lost & Found</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <header class="site-header">NYU Lost & Found</header>

    <main class="auth-card">
        <span class="eyebrow"> Get your stuff back</span>
        <h1>Welcome back.</h1>
        <p class="intro">Your campus. Your community. Your lost belongings.</p>

        <form>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email"
                   placeholder="you@nyu.edu" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>

            <button type="submit" disabled>Log in</button>
        </form>

        <p class="switch-page">
            New here? <a href="{{ url_for('signup') }}">Create an account</a>
        </p>
    </main>
</body>
</html>
