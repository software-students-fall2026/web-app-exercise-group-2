<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lost and Found</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        <header class="site-header">
            <span>NYU Lost & Found</span>
            <nav class="header-actions">
                <a href="{{ url_for('home') }}" class="header-button">&larr; Back</a>
            </nav>
        </header>

        <main class="page">
            <form class="card form" action="{{ url_for('edit_post', post_id=post._id) }}" method="POST">
                <h1>Edit a post</h1>

                <label for="post-title">Post title</label>
                <input type="text" id="post-title" name="title" placeholder="Title" 
                value="{{ post.title }}" required
                pattern=".*\S.*" title="Reply can't be empty.">

                <label for="item-desc">Item description</label>
                <input type="text" id="item-desc" name="description" placeholder="Description" 
                value="{{ post.description }}" required
                pattern=".*\S.*" title="Reply can't be empty.">

                <label for="last-seen">Last seen</label>
                <input type="text" id="last-seen" name="last_seen" placeholder="Location/Date" 
                value="{{ post.last_seen }}" required
                pattern=".*\S.*" title="Reply can't be empty.">

                <button type="submit" class="button">Save changes</button>
            </form>
        </main>
    </body>
</html>
