<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Lost & Found</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <header class="site-header">Lost & Found</header>

    <main class="auth-card">
        <span class="eyebrow">A LITTLE LOST. ALMOST FOUND.</span>
        <h1>Join your community.</h1>
        <p class="intro">Help lost belongings find their way home.</p>

        <form>
            <label for="name">Full name</label>
            <input type="text" id="name" name="name"
                   autocomplete="name" required>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email"
                   placeholder="you@nyu.edu" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" autocomplete="new-password"
                   aria-describedby="password-help" required>
            <p id="password-help" class="form-note">Use at least 8 characters.</p>

            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password"
                   name="confirm_password" minlength="8"
                   autocomplete="new-password" required>

            <button type="submit" disabled>Create account</button>
            <p class="form-note">Account creation is coming next.</p>
        </form>

        <p class="switch-page">
            Already a member? <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </main>
</body>
</html>
