<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lost and Found</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <div class="home">
            <header class="home-header">
                <h1 class="white">Lost and Found</h1>
                <a href="{{ url_for('logout') }}" class="add-post-button">Log out</a>
                <a href="{{ url_for('add_post') }}" class="add-post-button">+ Add post</a>
            </header>

            <main class="post-feed">
                {% for post in posts: %}
                    <div class="post-card">
                        <h2>{{ post.title }}</h2>
                        <p>{{ post.description }}</p>
                        <p class="last-seen">Last seen: {{ post.last_seen }}</p>
                    </div>
                {% else %}
                    <p>No posts yet.</p>
                {% endfor %}
            </main>
        </div>
    </body>
</html>
