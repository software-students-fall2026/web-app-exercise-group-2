<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ post.title }}</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <div class="home">
            <header class="home-header">
                <h1 class="white">Lost and Found</h1>
                <a href="{{ url_for('home') }}" class="back-button">Back</a>
            </header>

            <div class="details">
                <div class="post-card">
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.description }}</p>
                    <p class="last-seen">Last seen: {{ post.last_seen }}</p>
                </div>

                {% if post.user_id == current_user.id %}
                    <a href="{{ url_for('edit_post', post_id=post._id) }}" class="back-button">
                        Edit post
                    </a>

                    <form method="POST" action="{{ url_for('delete', post_id=post._id)}}">
                        <button type="submit" class="submit-button">Delete post</button>
                    </form>
                {% endif %}

                <form method="POST" action="{{ url_for('add_reply', post_id=post._id) }}" class="post-info">
                    <label for="content">Reply Content:</label>
                    <input type="text" id="content" name="content">

                    <input type="hidden" name="post_id" value="{{ post._id }}">

                    <button type="submit" class="submit-button">Post</button>
                </form>

                <section class="post-feed">
                    {% for reply in replies: %}
                        <div class="post-card">
                            <p>{{ reply.content }}</p>
                        </div>
                    {% else %}
                        <p>No replies yet.</p>
                    {% endfor %}
                </section>
            </div>
        </div>
    </body>
</html>
