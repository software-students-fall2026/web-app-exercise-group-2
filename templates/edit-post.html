<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit post | Lost and Found</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <main class="add-post">
            <header class="add-post-header">
                <a href="{{ url_for('home') }}" class="back-button">&larr; Back</a>
                <h1 class="white">Edit post</h1>
            </header>
            {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
            <form class="post-info" method="POST" action="{{ url_for('edit_post', post_id=post.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="post-title">Post title:</label>
                <input type="text" id="post-title" name="title" value="{{ post.get('title', '') }}" required>
                <label for="item-desc">Item description:</label>
                <textarea id="item-desc" name="description" required>{{ post.get('description', '') }}</textarea>
                <label for="last-seen">Last seen:</label>
                <input type="text" id="last-seen" name="last_seen" value="{{ post.get('last_seen', '') }}" required>
                <div class="form-actions">
                    <button type="submit" class="submit-button">Save changes</button>
                    <a class="action-button" href="{{ url_for('home') }}">Cancel</a>
                </div>
            </form>
        </main>
    </body>
</html>
