<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lost and Found</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <div class="add-post">
            <header class="add-post-header">
                <a href="{{ url_for('home') }}" class="back-button">&larr; Back</a>
                <h1 class="white">Add a post</h1>
            </header>

            {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
            <form class="post-info" action="{{ url_for('create_post') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="post-title">Post title:</label>
                <input type="text" id="post-title" name="title" placeholder="Title" value="{{ post.get('title', '') }}" required>

                <label for="item-desc">Item description:</label>
                <textarea id="item-desc" name="description" placeholder="Description" required>{{ post.get('description', '') }}</textarea>

                <label for="last-seen">Last seen:</label>
                <input type="text" id="last-seen" name="last_seen" placeholder="Location/Date" value="{{ post.get('last_seen', '') }}" required>

                <button type="submit" class="submit-button">Post</button>
            </form>
        </div>
    </body>
</html>
